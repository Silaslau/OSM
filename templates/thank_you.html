<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - OSM Evaluation</title>
  <style>
    html { 
      background: linear-gradient(90deg, #FF4E50 10%, #F9D423 90%); 
      overflow: hidden; 
      height: 100vh; 
    }
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 40px; 
      background: linear-gradient(90deg, #FF4E50 10%, #F9D423 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .thank-you-card { 
      background: rgba(255, 255, 255, 0.95); 
      padding: 60px 40px; 
      border-radius: 20px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 500px;
      width: 100%;
      backdrop-filter: blur(10px);
      animation: slideInUp 0.8s ease-out;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .success-icon {
      font-size: 72px;
      color: #4CAF50;
      margin-bottom: 20px;
      animation: bounceIn 1s ease-out 0.3s both;
    }
    
    @keyframes bounceIn {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        transform: scale(1.05);
      }
      70% {
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .thank-you-title { 
      font-size: 32px; 
      color: #333; 
      margin-bottom: 16px;
      font-weight: 600;
      animation: fadeInDown 0.8s ease-out 0.5s both;
    }
    
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .thank-you-message { 
      font-size: 18px; 
      color: #666; 
      line-height: 1.6;
      margin-bottom: 30px;
      animation: fadeInUp 0.8s ease-out 0.7s both;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .action-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 0.8s ease-out 0.9s both;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    
    .btn-primary {
      background: linear-gradient(45deg, #FF4E50, #F9D423);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 78, 80, 0.3);
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 78, 80, 0.4);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 1);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .countdown {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.8s ease-out 1.1s both;
    }
    
    /* 背景装饰动画 */
    .bg-decoration {
      position: fixed;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 6s ease-in-out infinite;
      z-index: -1;
    }
    
    .bg-decoration:nth-child(1) {
      top: 20%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .bg-decoration:nth-child(2) {
      top: 60%;
      right: 15%;
      animation-delay: 2s;
    }
    
    .bg-decoration:nth-child(3) {
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px) scale(1);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-20px) scale(1.1);
        opacity: 0.6;
      }
    }
    
    @media (max-width: 600px) {
      .thank-you-card {
        margin: 20px;
        padding: 40px 20px;
      }
      .action-buttons {
        flex-direction: column;
        align-items: center;
      }
      .btn {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <!-- 背景装饰元素 -->
  <div class="bg-decoration"></div>
  <div class="bg-decoration"></div>
  <div class="bg-decoration"></div>
  
  <div class="thank-you-card">
    <div class="success-icon">✓</div>
    <h1 class="thank-you-title">感谢您的参与！</h1>
    <div class="thank-you-message">
      您的评测数据已成功提交。感谢您为改进 AutoTour 做出的贡献！
    </div>
    <div class="action-buttons">
      <a href="/osm_simple" class="btn btn-primary">再次评测</a>
      <a href="/" class="btn btn-secondary">返回首页</a>
    </div>
    <div class="countdown" id="countdown">
      5秒后自动返回首页...
    </div>
  </div>

  <script>
    let seconds = 5;
    const countdownEl = document.getElementById('countdown');
    
    const timer = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        countdownEl.textContent = `${seconds}秒后自动返回首页...`;
      } else {
        clearInterval(timer);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
